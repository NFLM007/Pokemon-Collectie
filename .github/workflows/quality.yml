name: Website quality checks
on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check inline JavaScript and critical app functions
        run: node scripts/check-site.mjs
