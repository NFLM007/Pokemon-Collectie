value="all">Alles</option><option value="yes">In bezit</option><option value="no">Ontbreekt</option></select></div><div class="tabs" id="tabs" style="display:none"></div></header><main id="main"><div class="setcontrols"><button class="backbtn" id="back">← Sets</button></div><div class="setfilters" id="setfilters"><button class="filterbtn" id="ownedBtn">In bezit</button><button class="filterbtn" id="missingBtn">Niet in bezit</button></div><div class="sum" id="sum"></div><div class="grid" id="grid"></div></main><script>

const CSVQ={"Chaos Rising#21#Normal":2,"Perfect Order#82#Normal":3,"Mega Evolution#9#Normal":2,"Perfect Order#35#Normal":2,"Phantasmal Flames#34#Holo":3,"Perfect Order#77#Normal":3,"Perfect Order#64#Normal":2,"Perfect Order#59#Normal":2,"Mega Evolution#10#Holo":2,"Perfect Order#34#Normal":2,"Mega Evolution Energy#7#Normal":4,"Sword & Shield#130#Normal":4,"Phantasmal Flames#10#Normal":2,"Fusion Strike#240#Normal":2,"Perfect Order#86#Holo":2,"Perfect Order#27#Normal":2,"Battle Styles#125#Normal":2,"Phantasmal Flames#23#Normal":22,"Mega Evolution Energy#1#Normal":3,"Perfect Order#5#Normal":2,"Mega Evolution Energy#6#Normal":2,"Perfect Order#26#Normal":2,"Perfect Order#9#Normal":3,"Chaos Rising#53#Normal":2,"Pitch Black#22#Normal":2,"Perfect Order#52#Normal":2,"Pitch Black#36#Normal":2,"Vivid Voltage#112#Normal":4,"Perfect Order#48#Normal":3,"Phantasmal Flames#16#Normal":2,"Perfect Order#61#Reverse":3,"Fusion Strike#186#Normal":2,"Sword & Shield#164#Normal":4,"Perfect Order#18#Normal":2,"Mega Evolution#69#Reverse":2,"Perfect Order#58#Normal":2,"Perfect Order#86#Reverse":2,"Mega Evolution Energy#2#Normal":2,"Perfect Order#73#Normal":2,"Perfect Order#36#Normal":2,"Chilling Reign#114#Normal":2,"Mega Evolution#8#Normal":2,"Chaos Rising#24#Reverse":2,"Perfect Order#43#Normal":2,"Fusion Strike#226#Normal":2,"Mega Evolution Energy#5#Normal":4,"Mega Evolution Energy#3#Normal":5,"Vivid Voltage#121#Normal":2,"Perfect Order#2#Normal":2,"Sword & Shield#163#Normal":2,"Phantasmal Flames#72#Normal":2,"Perfect Order#46#Normal":2,"Perfect Order#54#Holo":2,"Shining Fates#59#Normal":2,"Perfect Order#57#Normal":2,"Mega Evolution#28#Holo":2,"Mega Evolution Energy#8#Normal":5,"Perfect Order#42#Normal":3,"Perfect Order#84#Normal":2,"Sword & Shield#165#Normal":4,"Sword & Shield#131#Normal":3,"Rebel Clash#127#Normal":3};let meta=JSON.parse(localStorage.getItem("poke-meta-v1")||"{}"),cur=0,home=true,seed={},store=JSON.parse(localStorage.getItem("poke-all-v3")||"{}");const V=["Normal","Holo","Reverse","IR","UR","SIR","MHR/HR","1st Edition","W Promo"];
function key(s,n){return s[0]+"#"+n}
function vkey(s,n,v){return key(s,n)+"#"+v}
function legacy(s,n){let k=key(s,n);return k in store?store[k]:s[4].includes(n)}
function vqty(s,n,v){let q=store[vkey(s,n,v)+"#qty"];if(Number.isFinite(+q))return +q;let a=seed[key(s,n)];if(Array.isArray(a)){let base=a.filter(x=>x===v).length;if(!base&&["IR","UR","SIR","MHR/HR"].includes(v))base=a.filter(x=>x==="Holo").length;if(base){let cq=CSVQ[key(s,n)+"#"+v]||CSVQ[key(s,n)+"#Holo"];return cq||base}}let k=vkey(s,n,v);if(k in store)return store[k]?1:0;return 0}
function vhas(s,n,v){return vqty(s,n,v)>0}
function ownedVariants(s,n){return V.filter(v=>vhas(s,n,v))}
function has(s,n){return ownedVariants(s,n).length>0}
function setVariantQty(s,n,v,q){q=Math.max(0,parseInt(q)||0);store[vkey(s,n,v)]=q>0;store[vkey(s,n,v)+"#qty"]=q;localStorage.setItem("poke-all-v3",JSON.stringify(store))}function nums(s){return s[3]?[...Array(s[3])].map((_,i)=>i+1):s[4]}function img(s,n){if(s[0]==="2026 Pokémon Day"&&n===51)return "https://images.scrydex.com/pokemon/svp-51/medium";return "https://images.scrydex.com/pokemon/"+s[1]+"-"+n+"/medium"}function setImg(s){return SET_IMAGES[s[0]]||s._logo||""}
function mkey(s,n){return s[2]+"-"+String(n).padStart(3,"0")}
function cardName(s,n){if(s[0]==="2026 Pokémon Day"&&n===51)return "Pikachu";return meta[mkey(s,n)]?.name||("Kaart "+String(n).padStart(3,"0"))}
function cardKind(s,n){let m=meta[mkey(s,n)];return m?.rarity||"Kaartvariant"}
function specialVariant(m){let r=(m?.rarity||"").toLowerCase();if(r.includes("special illustration"))return "SIR";if(r.includes("illustration rare"))return "IR";if(r.includes("mega hyper")||r.includes("hyper rare"))return "MHR/HR";if(r.includes("ultra rare")||r.includes("full art"))return "UR";return ""}
function availableVariants(s,n){let m=meta[mkey(s,n)],sp=specialVariant(m);if(sp)return [sp];let x=m?.variants;if(x&&typeof x==="object"&&!Array.isArray(x)){let a=[];if(x.normal===true)a.push("Normal");if(x.holo===true)a.push("Holo");if(x.reverse===true)a.push("Reverse");if(x.firstEdition===true)a.push("1st Edition");if(x.wPromo===true)a.push("W Promo");if(a.length)return a}let r=(m?.rarity||"").toLowerCase();if(r.includes("ace spec"))return ["Holo","Reverse"];if(r.includes("holo"))return ["Holo","Reverse"];return ["Normal","Reverse"]}
async function loadMeta(s){if(s._loaded)return;s._loaded=true;try{let r=await fetch("https://api.tcgdex.net/v2/en/sets/"+s[2]);if(!r.ok)return;let d=await r.json();s._logo=d.logo||s._logo;(d.cards||[]).forEach(x=>{meta[x.id]={...meta[x.id],name:x.name,rarity:meta[x.id]?.rarity||"",variants:meta[x.id]?.variants||null}});localStorage.setItem("poke-meta-v1",JSON.stringify(meta));if(home&&!document.getElementById("q").value.trim())renderHome();else render();hydrateSet(s,d.cards||[])}catch(e){}}
async function hydrateSet(s,cards){let todo=cards.filter(x=>!meta[x.id]?._detail),i=0,workers=Math.min(10,todo.length);async function worker(){while(i<todo.length){let x=todo[i++];try{let r=await fetch("https://api.tcgdex.net/v2/en/cards/"+x.id);if(!r.ok)continue;let d=await r.json();meta[x.id]={...meta[x.id],name:d.name||x.name,rarity:d.rarity||"",variants:d.variants||null,_detail:true}}catch(e){}}}await Promise.all(Array.from({length:workers},worker));localStorage.setItem("poke-meta-v1",JSON.stringify(meta));if(home&&!document.getElementById("q").value.trim())renderHome();else render()}
async function loadCardDetail(s,n){let k=mkey(s,n),m=meta[k];if(m?._detail)return;if(!m)meta[k]={name:"Kaart "+String(n).padStart(3,"0"),rarity:"",variants:null};try{let r=await fetch("https://api.tcgdex.net/v2/en/cards/"+k);if(!r.ok)return;let d=await r.json();meta[k]={...meta[k],name:d.name||meta[k].name,rarity:d.rarity||meta[k].rarity,variants:d.variants||meta[k].variants,_detail:true};localStorage.setItem("poke-meta-v1",JSON.stringify(meta));render()}catch(e){}}
function renderHome(){home=true;document.getElementById("main").classList.remove("inset");document.querySelector(".setcontrols").style.display="none";document.getElementById("setfilters").style.display="none";let q=document.getElementById("q").value.trim();if(q){render();return}document.getElementById("sum").textContent="Kies een set";let g=document.getElementById("grid");g.className="homegrid";g.innerHTML="";S.forEach((s,i)=>{loadMeta(s);let own=nums(s).filter(n=>has(s,n)).length,b=document.createElement("button");b.className="settile";let si=setImg(s);b.innerHTML=(si?'<img class="setimg" loading="lazy" src="'+si+'" alt="'+s[0]+'">':'<div class="setimg"></div>')+'<span class="setname">'+s[0]+'</span><span class="setprogress">'+own+' / '+nums(s).length+' in bezit</span>';b.onclick=()=>{cur=i;home=false;location.hash="set="+encodeURIComponent(s[0]);document.getElementById("main").classList.add("inset");document.querySelector(".setcontrols").style.display="flex";document.getElementById("setfilters").style.display="flex";syncFilterButtons();render()};g.appendChild(b)})}function tabs(){let e=document.getElementById("tabs");e.innerHTML="";S.forEach((s,i)=>{let b=document.createElement("button");b.className="tab"+(i===cur?" on":"");b.textContent=s[0];b.onclick=()=>{cur=i;fetch("csv-seed.json?v=20261005-2").then(r=>r.json()).then(d=>{seed=d;tabs();render()}).catch(()=>{tabs();render()})};e.appendChild(b)})}function render(){if(!home){document.querySelector(".setcontrols").style.display="flex";document.getElementById("setfilters").style.display="flex";}let s=S[cur],q=document.getElementById("q").value.trim(),f=document.getElementById("f").value,records=[];if(q){S.forEach(ss=>{loadMeta(ss);nums(ss).forEach(n=>records.push({s:ss,n}))});let term=q.toLowerCase();records=records.filter(o=>{let n=o.n,ss=o.s,num=String(n),padded=num.padStart(3,"0"),name=cardName(ss,n).toLowerCase(),setname=ss[0].toLowerCase(),kind=cardKind(ss,n).toLowerCase(),match=num.includes(term)||padded.includes(term)||name.includes(term)||setname.includes(term)||kind.includes(term);return match&&(f==="all"||(f==="yes"&&has(ss,n))||(f==="no"&&!has(ss,n)))}).sort((a,b)=>cardName(a.s,a.n).localeCompare(cardName(b.s,b.n),undefined,{sensitivity:"base"})||a.s[0].localeCompare(b.s[0])||a.n-b.n);document.getElementById("sum").textContent=records.length+" zoekresultaten · alfabetisch"}else{loadMeta(s);let a=nums(s),own=a.filter(n=>has(s,n)).length;document.getElementById("sum").textContent=s[0]+" · "+own+" / "+a.length+" in bezit";records=a.filter(n=>f==="all"||(f==="yes"&&has(s,n))||(f==="no"&&!has(s,n))).map(n=>({s,n}))}let g=document.getElementById("grid");g.className="grid";g.innerHTML="";records.forEach(o=>{let s=o.s,n=o.n;let ov=ownedVariants(s,n),y=ov.length>0,av=availableVariants(s,n),e=document.createElement("article");e.className="card"+(y?" y":"");let ownedText=av.map(v=>'<span class="'+(vhas(s,n,v)?'ovyes':'ovno')+'">'+v+' '+(vhas(s,n,v)?'✓ ×'+vqty(s,n,v):'✕')+'</span>').join("");e.innerHTML='<div class="row"><span class="num">#'+String(n).padStart(3,"0")+'</span><span class="name">'+cardName(s,n)+'<span class="kind">'+(q?s[0]+' · ':'')+cardKind(s,n)+'</span><span class="ownedline '+(ov.length?"":"none")+'">'+ownedText+'</span></span><span class="status">'+(y?"✓ "+ov.length:"OPEN")+'</span></div><div class="details"><img class="pic" loading="lazy" src="'+img(s,n)+'" alt="'+s[0]+' #'+n+'" onerror="this.style.opacity=.15"><div class="qtywrap">'+av.map(v=>'<div class="qtyrow" data-v="'+v+'"><span class="qtylabel">'+v+'</span><button class="qtybtn minus">−</button><span class="qtynum">'+vqty(s,n,v)+'</span><button class="qtybtn plus">+</button></div>').join("")+'</div><button class="savebtn">Opslaan</button></div>';let draft={};av.forEach(v=>draft[v]=vqty(s,n,v));e.querySelector(".row").onclick=()=>{e.classList.toggle("open");if(e.classList.contains("open"))loadCardDetail(s,n)};e.querySelectorAll(".qtyrow").forEach(r=>{let v=r.dataset.v,num=r.querySelector(".qtynum");r.querySelector(".minus").onclick=ev=>{ev.stopPropagation();draft[v]=Math.max(0,draft[v]-1);num.textContent=draft[v]};r.querySelector(".plus").onclick=ev=>{ev.stopPropagation();draft[v]++;num.textContent=draft[v]}});e.querySelector(".savebtn").onclick=(ev)=>{ev.stopPropagation();av.forEach(v=>setVariantQty(s,n,v,draft[v]));render()};g.appendChild(e)})}document.getElementById("q").oninput=()=>{let q=document.getElementById("q").value.trim();if(q){home=false;document.getElementById("main").classList.add("inset");render()}else renderHome()};document.getElementById("back").onclick=()=>{document.getElementById("q").value="";history.replaceState(null,"",location.pathname+location.search);renderHome()};document.getElementById("f").onchange=()=>{syncFilterButtons();render()};
function syncFilterButtons(){
 let v=document.getElementById("f").value;
 document.getElementById("ownedBtn").classList.toggle("on",v==="yes");
 document.getElementById("missingBtn").classList.toggle("on",v==="no")
}
document.getElementById("ownedBtn").onclick=()=>{let f=document.getElementById("f");f.value=f.value==="yes"?"all":"yes";syncFilterButtons();render()};
document.getElementById("missingBtn").onclick=()=>{let f=document.getElementById("f");f.value=f.value==="no"?"all":"no";syncFilterButtons();render()};
async function init(){
  try{let r=await fetch("csv-seed.json?v=20261005-3");if(r.ok)seed=await r.json()}catch(e){}
  tabs();
  let m=location.hash.match(/^#set=(.+)$/);
  if(m){
    let name=decodeURIComponent(m[1]),i=S.findIndex(s=>s[0]===name);
    if(i>=0){cur=i;home=false;document.getElementById("main").classList.add("inset");document.querySelector(".setcontrols").style.display="flex";document.getElementById("setfilters").style.display="flex";syncFilterButtons();render();return}
  }
  renderHome()
}
window.addEventListener("hashchange",()=>{
  let m=location.hash.match(/^#set=(.+)$/);
  if(!m){renderHome();return}
  let name=decodeURIComponent(m[1]),i=S.findIndex(s=>s[0]===name);
  if(i>=0){cur=i;home=false;document.getElementById("main").classList.add("inset");document.querySelector(".setcontrols").style.display="flex";document.getElementById("setfilters").style.display="flex";syncFilterButtons();render()}
});
