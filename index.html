function key(s,n){return s[0]+"#"+n}
function vkey(s,n,v){return key(s,n)+"#"+v}
function legacy(s,n){let k=key(s,n);return k in store?store[k]:s[4].includes(n)}
function vqty(s,n,v){let q=store[vkey(s,n,v)+"#qty"];if(Number.isFinite(+q))return +q;let a=seed[key(s,n)];if(Array.isArray(a)){let base=a.filter(x=>x===v).length;if(!base&&["IR","UR","SIR","MHR/HR"].includes(v))base=a.filter(x=>x==="Holo").length;if(base){return base}}let k=vkey(s,n,v);if(k in store)return store[k]?1:0;return 0}

function has(s,n){return ownedVariants(s,n).length>0}

function hasDupes(s,n){return availableVariants(s,n).some(v=>vqty(s,n,v)>1)}

function specialVariant(m){let r=(m?.rarity||"").toLowerCase();if(r.includes("special illustration"))return "SIR";if(r.includes("illustration rare"))return "IR";if(r.includes("mega hyper")||r.includes("hyper rare"))return "MHR/HR";if(r.includes("ultra rare")||r.includes("full art"))return "UR";return ""}
function availableVariants(s,n){if(s[0]==="Temporal Forces"&&n===51)return ["Pokémon Day 2026"];let m=meta[mkey(s,n)],sp=specialVariant(m);if(sp)return [sp];let x=m?.variants;if(x&&typeof x==="object"&&!Array.isArray(x)){let a=[];if(x.normal===true)a.push("Normal");if(x.holo===true)a.push("Holo");if(x.reverse===true)a.push("Reverse");if(x.firstEdition===true)a.push("1st Edition");if(x.wPromo===true)a.push("W Promo");if(a.length)return a}let r=(m?.rarity||"").toLowerCase();if(r.includes("ace spec"))return ["Holo","Reverse"];if(r.includes("holo"))return ["Holo","Reverse"];return ["Normal","Reverse"]}
async function loadMeta(s){if(s._loaded)return;s._loaded=true;try{let r=await fetch("https://api.tcgdex.net/v2/en/sets/"+s[2]);if(!r.ok)return;let d=await r.json();s._logo=d.logo||s._logo;(d.cards||[]).forEach(x=>{meta[x.id]={...meta[x.id],name:x.name,rarity:meta[x.id]?.rarity||"",variants:meta[x.id]?.variants||null}});localStorage.setItem("poke-meta-v1",JSON.stringify(meta));if(home&&!document.getElementById("q").value.trim())renderHome();else render();hydrateSet(s,d.cards||[])}catch(e){}}
async function hydrateSet(s,cards){let todo=cards.filter(x=>!meta[x.id]?._detail),i=0,workers=Math.min(10,todo.length);async function worker(){while(i<todo.length){let x=todo[i++];try{let r=await fetch("https://api.tcgdex.net/v2/en/cards/"+x.id);if(!r.ok)continue;let d=await r.json();meta[x.id]={...meta[x.id],name:d.name||x.name,rarity:d.rarity||"",variants:d.variants||null,_detail:true}}catch(e){}}}await Promise.all(Array.from({length:workers},worker));localStorage.setItem("poke-meta-v1",JSON.stringify(meta));if(home&&!document.getElementById("q").value.trim())renderHome();else render()}
async function loadCardDetail(s,n){let k=mkey(s,n),m=meta[k];if(m?._detail)return;if(!m)meta[k]={name:"Kaart "+String(n).padStart(3,"0"),rarity:"",variants:null};try{let r=await fetch("https://api.tcgdex.net/v2/en/cards/"+k);if(!r.ok)return;let d=await r.json();meta[k]={...meta[k],name:d.name||meta[k].name,rarity:d.rarity||meta[k].rarity,variants:d.variants||meta[k].variants,_detail:true};localStorage.setItem("poke-meta-v1",JSON.stringify(meta));render()}catch(e){}}

display="flex";document.getElementById("setfilters").style.display="flex";syncFilterButtons();render()};g.appendChild(b)})}function tabs(){let e=document.getElementById("tabs");e.innerHTML="";S.forEach((s,i)=>{let b=document.createElement("button");b.className="tab"+(i===cur?" on":"");b.textContent=s[0];b.onclick=()=>{cur=i;fetch("csv-seed.json?v=20261006-1").then(r=>r.json()).then(d=>{seed=d;tabs();render()}).catch(()=>{tabs();render()})};e.appendChild(b)})}function render(){document.getElementById("binderpager")?.remove();if(!home)navOn("navCollection");document.getElementById("homeactions").style.display=home?"grid":"none";document.getElementById("boostbar").style.display="none";if(!home){document.querySelector(".setcontrols").style.display="flex";document.getElementById("setfilters").style.display="flex";}let s=S[cur],q=document.getElementById("q").value.trim(),f=document.getElementById("f").value,records=[];if(q){S.forEach(ss=>{loadMeta(ss);nums(ss).forEach(n=>records.push({s:ss,n}))});let term=q.toLowerCase();records=records.filter(o=>{let n=o.n,ss=o.s,num=String(n),padded=num.padStart(3,"0"),name=cardName(ss,n).toLowerCase(),setname=ss[0].toLowerCase(),kind=cardKind(ss,n).toLowerCase(),match=num.includes(term)||padded.includes(term)||name.includes(term)||setname.includes(term)||kind.includes(term);return match&&(f==="all"||(f==="yes"&&has(ss,n))||(f==="no"&&availableVariants(ss,n).some(v=>!vhas(ss,n,v)))||(f==="complete"&&complete(ss,n))||(f==="dupes"&&hasDupes(ss,n)))}).sort((a,b)=>cardName(a.s,a.n).localeCompare(cardName(b.s,b.n),undefined,{sensitivity:"base"})||a.s[0].localeCompare(b.s[0])||a.n-b.n);document.getElementById("sum").textContent=records.length+" zoekresultaten · alfabetisch"}else{loadMeta(s);let a=nums(s),own=a.filter(n=>has(s,n)).length,missing=a.reduce((t,n)=>t+availableVariants(s,n).filter(v=>!vhas(s,n,v)).length,0);document.getElementById("sum").textContent=s[0]+" · "+own+" / "+a.length+" in bezit · nog "+missing+" uitvoering"+(missing===1?"":"en")+" nodig";records=a.filter(n=>f==="all"||(f==="yes"&&has(s,n))||(f==="no"&&availableVariants(s,n).some(v=>!vhas(s,n,v)))||(f==="complete"&&complete(s,n))||(f==="dupes"&&hasDupes(s,n))).map(n=>({s,n}))}let g=document.getElementById("grid");g.className="grid";g.innerHTML="";records.forEach(o=>{let s=o.s,n=o.n;let ov=ownedVariants(s,n),y=ov.length>0,av=availableVariants(s,n),shownAv=(f==="no"?av.filter(v=>!vhas(s,n,v)):av),e=document.createElement("article");e.className="card"+(y&&f!=="no"?" y":"");let ownedText=shownAv.map(v=>'<span class="'+(vhas(s,n,v)?'ovyes':'ovno')+'">'+v+' '+(vhas(s,n,v)?'✓ ×'+vqty(s,n,v):'✕')+'</span>').join("");e.innerHTML='<div class="row"><span class="num">#'+String(n).padStart(3,"0")+'</span><span class="name">'+cardName(s,n)+'<span class="kind">'+(q?s[0]+' · ':'')+cardKind(s,n)+'</span><span class="ownedline '+(ov.length?"":"none")+'">'+ownedText+'</span></span><span class="status">'+(complete(s,n)?"✓ Compleet":(y?"✓ In bezit":"OPEN"))+'</span></div><div class="details"><img class="pic" loading="lazy" src="'+img(s,n)+'" alt="'+s[0]+' #'+n+'" onerror="this.style.opacity=.15"><div class="qtywrap">'+shownAv.map(v=>'<div class="qtyrow" data-v="'+v+'"><span class="qtylabel">'+v+'</span><button class="qtybtn minus">−</button><span class="qtynum">'+vqty(s,n,v)+'</span><button class="qtybtn plus">+</button></div>').join("")+'</div><div class="variants">'+shownAv.filter(v=>!vhas(s,n,v)).map(v=>'<button class="wishbtn '+(wished(s,n,v)?'on':'')+'" data-wish="'+v+'">⭐ '+v+'</button>').join("")+'</div><button class="savebtn">Opslaan</button></div>';let draft={};shownAv.forEach(v=>draft[v]=vqty(s,n,v));e.querySelector(".row").onclick=()=>{e.classList.toggle("open");if(e.classList.contains("open"))loadCardDetail(s,n)};e.querySelectorAll(".qtyrow").forEach(r=>{let v=r.dataset.v,num=r.querySelector(".qtynum");r.querySelector(".minus").onclick=ev=>{ev.stopPropagation();draft[v]=Math.max(0,draft[v]-1);num.textContent=draft[v]};r.querySelector(".plus function renderBinder(){home=false;navOn("navBinder");document.getElementById("q").value="";document.querySelector(".setcontrols").style.display="flex";document.getElementById("setfilters").style.display="none";document.getElementById("homeactions").style.display="none";document.getElementById("boostbar").style.display="none";let all=[];S.forEach((s,i)=>{if(binderSet!=="all"&&String(i)!==binderSet)return;nums(s).forEach(n=>{all.push({s,n})})});let per=9,pages=Math.max(1,Math.ceil(all.length/per));binderPage=Math.min(binderPage,pages-1);let slice=all.slice(binderPage*per,binderPage*per+per),g=document.getElementById("grid");document.getElementById("sum").innerHTML='<div class="binderhead"><strong>🃏 Digitale binder</strong><select class="binderselect" id="binderSet">'+['<option value="all">Alle sets</option>'].concat(S.map((s,i)=>'<option value="'+i+'" '+(String(i)===binderSet?'selected':'')+'>'+s[0]+'</option>')).join("")+'</select></div>';g.className="bindergrid";g.innerHTML=slice.length?slice.map(o=>'<button class="bindercard '+(has(o.s,o.n)?"":"missing")+'" data-set="'+S.indexOf(o.s)+'" data-n="'+o.n+'"><img loading="lazy" src="'+img(o.s,o.n)+'" alt="'+cardName(o.s,o.n)+'"><span class="bnum">#'+String(o.n).padStart(3,"0")+'</span>'+(has(o.s,o.n)?'<span class="bqty">×'+ownedVariants(o.s,o.n).reduce((t,v)=>t+vqty(o.s,o.n,v),0)+'</span>':'<span class="bmissing">ONTBREEKT</span>')+'</button>').join(""):'<div class="binderempty">Nog geen kaarten in deze binder.</div>';g.insertAdjacentHTML("afterend",'<div class="binderpager" id="binderpager"><button id="bprev" '+(binderPage===0?'disabled':'')+'>←</button><strong>'+(binderPage+1)+' / '+pages+'</strong><button id="bnext" '+(binderPage>=pages-1?'disabled':'')+'>→</button></div>');document.getElementById("binderSet").onchange=e=>{binderSet=e.target.value;binderPage=0;document.getElementById("binderpager")?.remove();renderBinder()};document.getElementById("bprev").onclick=()=>{binderPage--;document.getElementById("binderpag
